.row{opacity:0;transition:opacity 1.8s ease}
.go .eye{opacity:.75;transform:none;transition-delay:.3s}

main::before{content:'';position:absolute;left:50%;top:1vh;width:130vw;max-width:780px;height:380px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(157,176,255,.2),rgba(255,176,210,.07) 55%,transparent);z-index:-1;pointer-events:none;opacity:calc(.85 + .15*var(--p))}

 if(s==2||s==6)noise(t,.16,.11,2200,'bandpass');
 noise(t,s==7?.15:.04,s==7?.04:.03,8000,'highpass');

 fx=ac.createGain();fx.gain.value=.55;const dl=ac.createDelay(),fb=ac.createGain(),df=ac.createBiquadFilter();df.type='lowpass';df.frequency.value=2200;dl.delayTime.value=SP*3;fb.gain.value=.42;fx.connect(dl);dl.connect(df);df.connect(fb);fb.connect(dl);df.connect(master);

 const vb=ac.createBuffer(1,ac.sampleRate*3,ac.sampleRate),v=vb.getChannelData(0);for(let i=0;i<v.length;i++)v[i]=Math.random()<.0007?(Math.random()-.5)*.9:(Math.random()-.5)*.012;

const mm=document.getElementById('mm'),pol=document.getElementById('pol'),pimg=document.getElementById('pimg'),dots=document.getElementById('dots');
let pi=0,pt,busy=0,first=1;
dots.innerHTML=PH.map(()=>'<i></i>').join('');
function show(i){if(busy)return;busy=1;clearTimeout(pt);const go=()=>{pi=(i+PH.length)%PH.length;pimg.src=PH[pi];pol.style.setProperty('--r',((pi%2?1:-1)*(2+pi%3))+'deg');pol.className='';void pol.offsetWidth;pol.className='in';[...dots.children].forEach((d,k)=>d.className=k==pi?'a':'');setTimeout(()=>busy=0,700);pt=setTimeout(()=>show(pi+1),5200)};if(first){first=0;go()}else{pol.className='out';setTimeout(go,750)}}
document.getElementById('bm').onclick=()=>{mm.classList.add('on');requestAnimationFrame(()=>mm.classList.add('vis'));first=1;busy=0;show(0)};
document.getElementById('mmx').onclick=()=>{mm.classList.remove('vis');clearTimeout(pt);setTimeout(()=>mm.classList.remove('on'),600)};
pol.onclick=()=>show(pi+1);
</script></body></html>
